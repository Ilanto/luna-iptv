name: Testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quiet:
    name: Sessiz testler
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Sistem kütüphaneleri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv2 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 fonts-dejavu-core
      - name: Python ortamı
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Ruff ve testler (offscreen)
        run: ./scripts/test-quiet.sh

  native:
    name: Pencere testleri (sanal ekran)
    # openSUSE like the users' systems: the player needs libmpv >= 0.38 (Ubuntu 24.04 has 0.37).
    runs-on: ubuntu-24.04
    container: opensuse/tumbleweed
    timeout-minutes: 25
    steps:
      - name: Sistem paketleri
        run: |
          zypper --non-interactive install --no-recommends \
            git tar gzip python3 python3-pip xvfb-run xauth ffmpeg libmpv2 \
            Mesa-dri Mesa-libGL1 Mesa-libEGL1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 fontconfig dejavu-fonts libdbus-1-3 \
            libglib-2_0-0 libgthread-2_0-0
      - uses: actions/checkout@v4
      - name: Python ortamı
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Test videoları üretilebiliyor mu
        # Without ffmpeg's encoder the native suites skip, and skips would look green.
        run: ffmpeg -hide_banner -encoders | grep -q mpeg2video
      - name: Gerçek pencere ve video testleri (Xvfb)
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" .venv/bin/python -m pytest -q \
            -p no:cacheprovider -rs \
            tests/test_transport_ui.py tests/test_mini_player_native.py \
            tests/test_preferences_native.py
      - name: Oynatıcı ve açılış denetimi (Xvfb)
        if: always()
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" .venv/bin/python scripts/player_probe.py
          xvfb-run -a -s "-screen 0 1920x1080x24" .venv/bin/python scripts/smoke.py
